

spring.application.name=booking-service
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5432/Ticket_Nest_App
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone : http://localhost:8761/eureka
spring.cloud.openfeign.circuitbreaker.enabled=true


resilience4j.circuitbreaker.instances.event-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.event-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.event-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.event-service.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.payment-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.payment-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.payment-service.permitted-number-of-calls-in-half-open-state=3